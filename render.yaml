services:
  - type: web
    name: zoho-attendance-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ZOHO_EMAIL
        sync: false
      - key: ZOHO_PASSWORD
        sync: false
      - key: OUTLOOK_EMAIL
        sync: false
      - key: OUTLOOK_APP_PASSWORD
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: ZOHO_ACTION
        value: checkin
