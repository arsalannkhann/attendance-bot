name: Zoho People Attendance (Browser)

# Started by the Render service (app.py) at the exact IST time. The browser runs
# here because Render's free 512 MB instance runs out of memory on the Zoho
# People app. No `schedule:` trigger: GitHub cron drifts, Render keeps time.
# app.py's startup catch-up reads `run-name` to tell checkin from checkout, and
# skips dry runs because they never punch.
run-name: "attendance: ${{ inputs.action }} (${{ inputs.source }})${{ inputs.dry_run && ' dry-run' || '' }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: Which punch to make
        required: true
        default: checkin
        type: choice
        options: [checkin, checkout]
      force:
        description: Skip the weekend gate (smoke tests)
        type: boolean
        default: false
      dry_run:
        description: Log in and read the widget, but don't click
        type: boolean
        default: false
      source:
        description: What started the run (scheduler, catchup, api, manual)
        type: string
        default: manual

# One attendance run at a time. A duplicate dispatch waits its turn, then finds
# the widget already flipped and no-ops instead of punching twice.
concurrency:
  group: zoho-attendance
  cancel-in-progress: false

jobs:
  attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: playwright install chromium --with-deps

      # zoho_browser.py retries 3x itself and exits non-zero only when every
      # attempt failed, so the run's conclusion is the real outcome.
      - name: Run attendance
        env:
          ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
          ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
          ZOHO_TOTP: ${{ secrets.ZOHO_TOTP }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
          ACTION: ${{ inputs.action }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEBUG_DIR: ${{ runner.temp }}/attendance-debug
        run: python zoho_browser.py

      # always(): a run can succeed on a retry after earlier attempts saved
      # screenshots, and those are exactly the ones worth keeping.
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-debug-${{ github.run_id }}
          path: ${{ runner.temp }}/attendance-debug
          if-no-files-found: ignore
          retention-days: 7
