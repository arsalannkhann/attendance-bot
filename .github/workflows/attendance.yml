name: Zoho People Attendance (Browser)

on:
  schedule:
    - cron: '30 4 * * 1-5'
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        required: true
        default: 'checkin'
        type: choice
        options: [checkin, checkout]

jobs:
  attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright
        run: playwright install chromium --with-deps

      - name: Set ACTION
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ACTION=${{ github.event.inputs.action }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +'%H')
            if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 12 ]; then
              echo "ACTION=checkin" >> $GITHUB_ENV
            elif [ "$HOUR" -ge 14 ] && [ "$HOUR" -le 23 ]; then
              echo "ACTION=checkout" >> $GITHUB_ENV
            fi
          fi

      - name: Run automation (with retry)
        env:
          ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
          ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
          ZOHO_TOTP: ${{ secrets.ZOHO_TOTP }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
          ACTION: ${{ env.ACTION }}
        run: |
          for i in 1 2 3; do
            python zoho_browser.py && break
            echo "Retry $i..."
            sleep 10
          done

      - name: Upload debug screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_screenshot.png