name: Zoho People Attendance (Browser)

# IST = UTC+5:30
#   Check-in  12:00 PM IST = 06:30 UTC
#   Check-out 10:00 PM IST = 16:30 UTC

on:
  schedule:
    - cron: '30 6 * * 1-5'    # 12:00 PM IST — check-in
    - cron: '30 16 * * 1-5'   # 10:00 PM IST — check-out

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'checkin'
        type: choice
        options:
          - checkin
          - checkout

jobs:
  attendance:
    name: ${{ github.event.inputs.action || 'scheduled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install playwright pytz pyotp

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      # ── Determine action ──────────────────────────────────────────────────
      - name: Set ACTION for check-in trigger
        if: github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1-5'
        run: echo "ACTION=checkin" >> $GITHUB_ENV

      - name: Set ACTION for check-out trigger
        if: github.event_name == 'schedule' && github.event.schedule == '30 16 * * 1-5'
        run: echo "ACTION=checkout" >> $GITHUB_ENV

      - name: Set ACTION from manual input
        if: github.event_name == 'workflow_dispatch'
        run: echo "ACTION=${{ github.event.inputs.action }}" >> $GITHUB_ENV

      # ── Run browser automation ────────────────────────────────────────────
      - name: Run attendance automation
        env:
          ZOHO_EMAIL:    ${{ secrets.ZOHO_EMAIL }}
          ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
          ZOHO_TOTP:     ${{ secrets.ZOHO_TOTP }}     # leave empty if no MFA
          ACTION:        ${{ env.ACTION }}
        run: python zoho_browser.py

      # ── Upload debug screenshot on failure ────────────────────────────────
      - name: Upload debug screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_screenshot.png
          retention-days: 3
