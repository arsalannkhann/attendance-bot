name: Keep alive

# GitHub disables scheduled workflows on repos inactive for 60 days.
# This workflow commits a timestamp every Sunday to keep the repo active.

on:
  schedule:
    - cron: '0 0 * * 0'   # Every Sunday at 00:00 UTC
  workflow_dispatch:       # Also allow manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Commit keep-alive timestamp
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .keepalive
          git add .keepalive
          git commit -m "chore: keep-alive [skip ci]" || echo "Nothing to commit"
          git push
